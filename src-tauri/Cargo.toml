[package]
name = "chattahoochee"
version = "0.1.0"
description = "Chattahoochee native desktop host"
authors = ["OpenHoo"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "chattahoochee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls", "system-proxy", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"

[dev-dependencies]
serde_json = "1"
