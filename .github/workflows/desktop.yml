name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: macOS
          - os: windows-latest
            bundle: nsis
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: rustup update stable --no-self-update
      - run: rustup component add rustfmt
      - run: npm ci
      - run: npm run check
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Test native transport
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build local preview
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }} --no-sign --ci -- --locked
      - name: Archive macOS app with permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Chattahoochee.app src-tauri/target/release/bundle/Chattahoochee.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Chattahoochee-${{ matrix.artifact }}-preview
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
